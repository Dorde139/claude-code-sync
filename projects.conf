#!/bin/bash
# Project registry — single source of truth for sync scripts
# Format: "short-name|memory-dir-name"
#
# short-name:       Your project's folder name (e.g., "my-app")
# memory-dir-name:  The encoded path under ~/.claude/projects/
#                   Find yours with: ls ~/.claude/projects/
#                   Leave empty if the project has no memory yet
#
# CODE_DIR:  Parent directory where all your projects live
# CLAUDE_DIR: Claude Code's config directory (usually ~/.claude)

CODE_DIR="$HOME/Code"
CLAUDE_DIR="$HOME/.claude"

PROJECTS=(
  # "my-project|c--Users-me-Code-my-project"
  # "another-project|c--Users-me-Code-another-project"
)
